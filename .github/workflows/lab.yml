name: lab
on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          mkdir -p out
          uname -m
          free -m
          chmod +x INJECT-GPT.sh
          timeout -s KILL 90 strace -f -tt -s 400 -o out/trace.txt ./INJECT-GPT.sh > out/stdout.txt 2>&1
          echo "rc=$?"
          echo "--- stdout"
          head -120 out/stdout.txt || true
          echo "--- net"
          grep -aE 'connect|socket|sendto|recvfrom|bind' out/trace.txt | head -80 || true
          echo "--- files"
          grep -aE 'openat|memfd|execve|mprotect' out/trace.txt | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
